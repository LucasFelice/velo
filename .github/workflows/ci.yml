# Workflow de CI dedicado exclusivamente à execução de testes unitários.
# Estrutura preparada para futuras expansões do pipeline.

name: Continuous Integration

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Baixa o código-fonte do repositório.
      - name: Checkout
        uses: actions/checkout@v6.1.0

      # Configura a versão do Node.js definida nas variáveis globais.
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para disponibilizar o Yarn.
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências respeitando o arquivo yarn.lock.
      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      # Executa exclusivamente os testes unitários com Vitest.
      - name: Run Unit Tests
        run: yarn test
